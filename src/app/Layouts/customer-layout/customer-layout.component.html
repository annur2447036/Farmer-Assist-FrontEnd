<div class="d-flex flex-column min-vh-100 bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-2">
    <div class="container">

      <a class="navbar-brand fw-bold text-primary fs-4">
        🌾 Kisan Link
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-between" id="navbarNav">

        <ul class="navbar-nav fw-medium gap-2">

          <li class="nav-item">
            <a class="nav-link px-3 rounded" routerLink="/customer/home" routerLinkActive="active-link">
              🏠 Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link px-3 rounded" routerLink="/customer/products" routerLinkActive="active-link">
              🛒 Products
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link px-3 rounded" routerLink="/customer/cart" routerLinkActive="active-link">
              🧺 Cart
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link px-3 rounded" routerLink="/customer/myOrder" routerLinkActive="active-link">
              📦 Orders
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link px-3 rounded" routerLink="/customer/feedback" routerLinkActive="active-link">
              💬 Feedback
            </a>
          </li>

        </ul>

        <ul class="navbar-nav align-items-center gap-3">

          <li class="nav-item">
            <span class="fw-semibold text-dark">
              👤 {{customer?.name}}
            </span>
          </li>

          <li class="nav-item">
            <button class="btn btn-outline-danger btn-sm px-3" (click)="logOut()">
              🚪 Logout
            </button>
          </li>

        </ul>

      </div>
    </div>

  <div class="container flex-grow-1 my-4">

  </div>
  <app-footer></app-footer>
