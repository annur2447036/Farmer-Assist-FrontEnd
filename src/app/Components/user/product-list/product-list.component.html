<div class="container-fluid mt-3 py-3 min-vh-100 main-bg">
  <div class="row g-3">

    <div class="col-md-3">
      <div class="bg-white rounded-4 shadow-sm p-3">

        <h5 class="text-center fw-bold mb-3">Categories</h5>

        <div class="overflow-auto category-scroll">

          <div *ngFor="let c of categoriesList"
               class="card mb-3 border-0 rounded-4 hover-card"
               [ngClass]="{'border border-primary': selectedCategory?.id === c.id}"
               (click)="selectCategory(c)"
               style="cursor:pointer;">

            <img [src]="c.imageurl"
                 class="card-img-top rounded-top-4 category-img">

            <div class="card-body text-center p-2">
              <small class="fw-semibold">{{c.name}}</small>
            </div>

          </div>

        </div>

      </div>
    </div>

    <div class="col-md-9">
      <div class="p-3 rounded-4 product-bg">

        <h4 *ngIf="selectedCategory" class="fw-bold mb-3">
          {{ selectedCategory.name }} Products
        </h4>

        <div class="row g-3">

          <div *ngFor="let p of productList"
               class="col-xl-3 col-lg-4 col-md-6 col-sm-6">

            <div class="card h-100 border-0 rounded-4 shadow-sm hover-card">

              <img [src]="p.images[0]?.imageUrl"
                   class="card-img-top rounded-top-4 product-img">

              <div class="card-body d-flex flex-column">

                <h6 class="fw-semibold mb-1">
                  {{p.product_name}}
                </h6>

                <p class="text-success fw-bold mb-2">
                  {{ p.price | currency:'INR' }}
                </p>

                <div class="small text-muted mb-2"
                     *ngFor="let s of p.specifications">
                  {{ s.name }} : {{ s.value }}
                </div>

                <p class="small mb-3">
                  👨‍🌾 {{p.farmer.name}}
                </p>

                <a class="btn btn-primary btn-sm rounded-pill mt-auto"
                   [routerLink]="['/customer/products', p.id]">
                   View Details
                </a>

              </div>

            </div>

          </div>

        </div>

        <div *ngIf="productList.length === 0 && selectedCategory"
             class="text-center mt-5">

          <h5 class="text-muted">No products found 😕</h5>
          <p class="text-muted small">Try another category</p>

        </div>

      </div>
    </div>

  </div>
</div>
